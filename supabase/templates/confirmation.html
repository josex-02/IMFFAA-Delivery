<!doctype html>
<html lang="es">
  <body style="margin:0;background:#f4f6f4;font-family:Arial,sans-serif;color:#202522">
    <main style="max-width:520px;margin:32px auto;padding:28px;background:#fff;border-radius:16px">
      <div style="font-weight:800;color:#238841;font-size:22px">IMFFAA Delivery</div>
      <h2>Tu código de verificación</h2>
      <p>Introduce este código de seis dígitos en IMFFAA Delivery para confirmar tu correo electrónico. Puedes hacerlo desde cualquier dispositivo.</p>
      <div style="font-size:32px;letter-spacing:8px;font-weight:800;background:#f0f3f0;padding:18px;text-align:center;border-radius:12px;color:#238841">{{ .Token }}</div>
      <p>Este código es temporal. Si no solicitaste esta cuenta, puedes ignorar este mensaje.</p>
    </main>
  </body>
</html>
